name: Build & Release Decryptor IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（仅用于产物命名）"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: 生成 entitlements（LF / 无 BOM / 无 DOCTYPE，规避 AMFIUnserializeXML 解析失败）
        run: |
          cat > src/dumpdecrypted/dylib_entitlements.plist <<'PLIST'
          <plist version="1.0">
          <dict>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST

          cat > src/host/entitlements.plist <<'PLIST'
          <plist version="1.0">
          <dict>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Build dumpdecrypted.dylib (arm64, iOS 16)
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -dynamiclib -fPIC -o build/dumpdecrypted.dylib \
            src/dumpdecrypted/dumpdecrypted.c
          codesign -s - --entitlements src/dumpdecrypted/dylib_entitlements.plist \
            build/dumpdecrypted.dylib

      - name: Generate Xcode project
        run: |
          rm -rf Decryptor.xcodeproj
          xcodegen generate --spec project.yml
          # runner 自带 Xcode 15.4 不支持 xcodegen 2.46 默认生成的 objectVersion(77/Xcode16)，降级到 56(Xcode15)
          sed -i.bak -E 's/objectVersion = [0-9]+/objectVersion = 56/' Decryptor.xcodeproj/project.pbxproj
          rm -f Decryptor.xcodeproj/project.pbxproj.bak

      - name: Build app (ad-hoc, 关闭签名)
        run: |
          xcodebuild -project Decryptor.xcodeproj -scheme Decryptor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build \
            CONFIGURATION_BUILD_DIR=$PWD/build/app

      - name: 嵌入 dylib 并签名 App
        run: |
          cp build/dumpdecrypted.dylib build/app/Decryptor.app/dumpdecrypted.dylib
          # 不写 --deep：保留 dylib 自身的 skip-library-validation 签名
          codesign -s - --entitlements src/host/entitlements.plist \
            build/app/Decryptor.app

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -r build/app/Decryptor.app Payload/
          zip -r Decryptor.ipa Payload
          rm -rf Payload

      - name: 构建「无 entitlement 调试版」IPA（隔离闪退是否由私有 entitlement 引起）
        run: |
          mkdir -p build/debug
          cp -r build/app/Decryptor.app build/debug/Decryptor.app
          # 空 entitlements：去掉所有私有键，AMFI 不会拒绝，用于确认 App 本身能否启动
          printf '<plist version="1.0"><dict/></plist>' > /tmp/empty_ent.plist
          codesign -f -s - --entitlements /tmp/empty_ent.plist build/debug/Decryptor.app
          mkdir -p Payload
          cp -r build/debug/Decryptor.app Payload/
          zip -r Decryptor-debug.ipa Payload
          rm -rf Payload

      - name: 构建「最小化 entitlement 版」IPA（定位具体是哪个私有键被拒）
        run: |
          mkdir -p build/minimal
          cp -r build/app/Decryptor.app build/minimal/Decryptor.app
          # 仅保留 TrollStore 类 App（如 Filza）最常用的两个私有键 + 关闭库校验
          cat > /tmp/min_ent.plist <<'PLIST'
          <plist version="1.0">
          <dict>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST
          codesign -f -s - --entitlements /tmp/min_ent.plist build/minimal/Decryptor.app
          mkdir -p Payload
          cp -r build/minimal/Decryptor.app Payload/
          zip -r Decryptor-minimal.ipa Payload
          rm -rf Payload

      - name: 上传构建产物（始终）
        uses: actions/upload-artifact@v4
        with:
          name: Decryptor-ipa
          path: Decryptor*.ipa

      - name: 发布到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Decryptor.ipa
          name: Decryptor ${{ github.ref_name }}
          generate_release_notes: true
